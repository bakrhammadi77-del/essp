<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2d3a8c">
<title>ESSP</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --brand:#2d3a8c; --accent:#f29a1f; --ink:#1b2230; --paper:#f6f5f1; --card:#fff;
    --line:#d9d6cc; --muted:#667085; --ok:#1f8a4c; --warn:#b3261e; --red:#c62828;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",system-ui,sans-serif;font-size:16px;line-height:1.5;padding-bottom:92px}
  body.noscroll{overflow:hidden}
  header{background:var(--brand);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:10px}
  header img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#fff}
  header h1{margin:0;font-size:1.05rem}
  main{max-width:760px;margin:0 auto;padding:14px}
  section{display:none}
  section.active{display:block}
  h2{font-size:1.1rem;margin:20px 0 8px;padding-top:6px}
  h3{font-size:1rem;margin:16px 0 6px}
  label{display:block;font-size:.88rem;color:var(--muted);margin:10px 0 4px}
  input,select,textarea{width:100%;padding:10px;font:inherit;color:inherit;border:1px solid var(--line);border-radius:6px;background:#fff}
  input[type=checkbox],input[type=radio]{width:20px;height:20px;padding:0;flex:none}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
  button{font:inherit;padding:10px 14px;border-radius:6px;cursor:pointer;border:1px solid var(--brand);background:var(--brand);color:#fff}
  button.ghost{background:transparent;color:var(--brand)}
  button.danger{background:transparent;color:var(--warn);border-color:var(--warn)}
  button.ok{background:var(--ok);border-color:var(--ok)}
  button.sm{padding:6px 10px;font-size:.88rem}
  .muted{color:var(--muted);font-size:.9rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin:8px 0}
  .warnbox{border-color:var(--accent);background:#fff8ec}
  .row{display:flex;gap:8px;align-items:center}
  .row > select,.row > input{flex:1;min-width:0}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .split{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .total{font-weight:700}
  .red{color:var(--red)} .green{color:var(--ok)}
  .badge{font-size:.78rem;padding:2px 8px;border-radius:99px;color:#fff;background:var(--muted)}
  .badge.ok{background:var(--ok)} .badge.warn{background:var(--warn)} .badge.mid{background:var(--accent);color:#1b2230}
  .prow{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center}
  .prow .who{display:flex;gap:8px;align-items:center;font-size:1.02rem}
  .prow .pp{text-align:end}
  .prow .site{grid-column:1/-1}
  .seg3{display:grid;grid-template-columns:repeat(3,1fr);grid-column:1/-1}
  .seg3 button{border-radius:0;background:#fff;color:var(--brand);padding:9px 4px}
  .seg3 button.on{background:var(--brand);color:#fff}
  .seg3 button.abs.on{background:var(--muted);border-color:var(--muted)}
  .seg3 button:first-child{border-start-start-radius:6px;border-end-start-radius:6px}
  .seg3 button:last-child{border-start-end-radius:6px;border-end-end-radius:6px}
  .pick{display:flex;gap:10px;align-items:center;margin:0;padding:8px 0;border-bottom:1px solid var(--line);color:var(--ink);font-size:.95rem}
  .pick span{flex:1}
  .inl{display:inline-flex;align-items:center;gap:6px;margin:6px 14px 6px 0;color:var(--ink);font-size:1rem}
  .lcard{display:grid;gap:8px}
  .tw{overflow-x:auto}
  .logt{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line)}
  .logt th{color:var(--brand);font-weight:700;padding:10px 6px;background:#eef0fa;text-align:center;font-size:.9rem}
  .logt td{padding:10px 6px;text-align:center;border-top:1px solid var(--line);font-size:.95rem}
  .logt tr[data-act]{cursor:pointer}
  .logt td small{color:var(--muted);font-size:.72rem}
  .logt .wu{color:var(--red);font-weight:700}
  .logt .wp{color:var(--ok);font-weight:700}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
  .cal .wd{text-align:center;font-size:.75rem;color:var(--muted)}
  .cd{aspect-ratio:1;padding:0;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;font-size:.9rem}
  .cd.empty{border:0;background:transparent}
  .cd.unp{background:var(--accent);border-color:var(--accent)}
  .cd.paid{background:var(--ok);border-color:var(--ok);color:#fff}
  .cd.sel{outline:3px solid var(--brand);outline-offset:1px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;margin:8px 0}
  .legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-inline-end:4px;border:1px solid var(--line)}
  nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:#fff;border-top:1px solid var(--line);z-index:10;padding-bottom:env(safe-area-inset-bottom,0px)}
  nav button{flex:1;min-width:0;border:0;border-radius:0;background:transparent;color:var(--muted);padding:6px 1px;font-size:.66rem;line-height:1.2}
  nav button .ic{display:block;font-size:1.2rem}
  nav button.active{color:var(--brand);font-weight:700;box-shadow:inset 0 3px 0 var(--accent)}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:#fff;width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px}
  #viewer{position:fixed;inset:0;background:#e6e5e0;z-index:50;overflow:auto}
  .vbar{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
  .seg{display:flex}
  .seg button{background:#fff;color:var(--brand);border-radius:0}
  .seg button:first-child{border-start-start-radius:6px;border-end-start-radius:6px}
  .seg button:last-child{border-start-end-radius:6px;border-end-end-radius:6px}
  .seg button.on{background:var(--brand);color:#fff}

  html,body{overscroll-behavior-y:none}
  label.mini{margin:0 0 3px;font-size:.78rem}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .pk{display:flex;gap:10px;align-items:center;flex:1;margin:0;color:var(--ink);font-size:.95rem}
  .pk span{display:grid}
  .pk small{color:var(--muted)}
  .pick2{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
  .pick2 .pq{width:84px;flex:none;text-align:center}
  .pickbar{position:sticky;bottom:-16px;background:#fff;padding:10px 0 4px;border-top:1px solid var(--line);margin-top:8px}
  .vnote{margin:8px;padding:8px 10px;border:1px solid var(--accent);background:#fff8ec;border-radius:8px;font-size:.85rem}
  button.dangerSolid{background:var(--warn);border-color:var(--warn);color:#fff}
  #dlg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:110;display:flex;align-items:center;justify-content:center;padding:20px}
  .dbox{background:#fff;border-radius:12px;padding:18px;width:100%;max-width:420px}
  .dbox p{margin:0 0 12px;white-space:pre-line}
  #lock{position:fixed;inset:0;z-index:100;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;padding:24px}
  .lbox{width:100%;max-width:340px;text-align:center;display:grid;gap:12px}
  .lbox img{width:96px;height:96px;margin:0 auto;border-radius:50%;object-fit:cover;background:#fff}
  .lbox h2{margin:0;color:#fff}
  .lbox input{text-align:center;font-size:1.2rem}
  .lbox button{background:#fff;color:var(--brand);border-color:#fff}
  .lbox button.linkb{background:transparent;color:#fff;border-color:transparent;text-decoration:underline;font-size:.9rem}
  .lockmsg{min-height:1.4em;color:#ffd7a0;font-size:.95rem}

  /* ===== Documents (this is what becomes the PDF) ===== */
  .doc{background:#fff;color:#14181f;padding:24px;font-size:14px;line-height:1.5;max-width:700px;margin:12px auto;border:1px solid var(--line)}
  .doc .dhead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:3px solid var(--brand);padding-bottom:14px}
  .doc .brand{display:flex;gap:12px;align-items:flex-start}
  .doc .brand img{width:86px;height:86px;object-fit:contain;flex:none}
  .doc .cname{font-weight:700;font-size:1.15em;color:var(--brand)}
  .doc .cinfo{font-size:.86em;color:#333}
  .doc .dmeta{text-align:end;font-size:.92em;flex:none}
  .doc .dtitle{font-size:1.4em;font-weight:700;color:var(--brand);margin-bottom:4px}
  .doc table{width:100%;border-collapse:collapse;margin-top:12px}
  .doc th{background:var(--brand);color:#fff;padding:7px 6px;text-align:start;font-weight:600;font-size:.86em}
  .doc td{padding:7px 6px;border-bottom:1px solid #e1e4ea;vertical-align:top;font-size:.94em}
  .doc td small{color:#777;font-size:.8em}
  .doc .n{text-align:end;white-space:nowrap}
  .doc .c{text-align:center}
  .doc .red{color:#c62828;font-weight:700}
  .doc .green{color:#1f8a4c;font-weight:700}
  .doc .box{border:1px solid #cfd4de;border-radius:6px;padding:10px 12px;margin-top:12px}
  .doc .box .cap{font-size:.82em;color:#666}
  .doc .tot{margin-top:12px;margin-inline-start:auto;width:min(100%,320px)}
  .doc .tot div{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
  .doc .tot .grand{border-top:2px solid var(--brand);font-weight:700;font-size:1.08em;color:var(--brand);margin-top:4px;padding-top:6px}
  .doc .sign{display:flex;gap:28px;margin-top:46px}
  .doc .sign div{flex:1;border-top:1px solid #333;padding-top:4px;text-align:center;font-size:.86em}
  .doc .foot{margin-top:22px;text-align:center;color:#555;font-size:.88em;border-top:1px solid #e1e4ea;padding-top:8px}
  .doc .line{display:flex;gap:8px;align-items:baseline;margin-top:14px}
  .doc .line .lb{white-space:nowrap;font-weight:600}
  .doc .line .vl{flex:1;border-bottom:1px dotted #555;min-height:1.5em;padding:0 6px}
  .doc .amt{border:2px solid var(--brand);border-radius:6px;padding:6px 16px;font-size:1.4em;font-weight:700;display:inline-block;color:var(--brand)}
  .doc .cb{display:inline-block;width:14px;height:14px;border:1.5px solid #333;vertical-align:-2px;margin-inline:4px}
  .doc .cb.on{background:var(--brand)}
  .doc .stmt{margin-top:14px;font-size:.92em;color:#333}
</style>
</head>
<body>
<header><img id="hLogo" alt=""><h1 data-i="app"></h1></header>

<main>
  <section id="tab-daily" class="active"><div id="dailyView"></div></section>
  <section id="tab-workers"><div id="workersView"></div></section>
  <section id="tab-invoices"><div id="invoicesView"></div></section>
  <section id="tab-receipts"><div id="receiptsView"></div></section>
  <section id="tab-dir"><div id="dirView"></div></section>
  <section id="tab-report"><div id="reportView"></div></section>
  <section id="tab-settings"><div id="settingsView"></div></section>
</main>

<nav>
  <button data-tab="daily" class="active"><span class="ic">📅</span><span data-i="tabDaily"></span></button>
  <button data-tab="workers"><span class="ic">👷</span><span data-i="tabWorkers"></span></button>
  <button data-tab="invoices"><span class="ic">🧾</span><span data-i="tabInvoices"></span></button>
  <button data-tab="receipts"><span class="ic">💵</span><span data-i="tabReceipts"></span></button>
  <button data-tab="dir"><span class="ic">📦</span><span data-i="tabDir"></span></button>
  <button data-tab="report"><span class="ic">📊</span><span data-i="tabReport"></span></button>
  <button data-tab="settings"><span class="ic">⚙️</span><span data-i="tabSettings"></span></button>
</nav>

<div id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div id="dlg" hidden></div>
<div id="lock" hidden></div>

<div id="viewer" hidden>
  <div class="vbar">
    <button class="ghost sm" data-act="vClose" data-i="close"></button>
    <div class="seg"><button class="sm" data-act="vLang" data-l="ar">العربية</button><button class="sm" data-act="vLang" data-l="en">English</button></div>
    <button class="sm" data-act="vPdf" data-i="download"></button>
    <button class="ghost sm" data-act="vShare" data-i="share"></button>
    <button class="sm ok" id="vWaBtn" data-act="vWa" data-i="waBtn"></button>
    <button class="ghost sm" id="vCopyBtn" data-act="vCopy" data-i="copyBtn"></button>
  </div>
  <div class="vnote" id="vnote" hidden></div>
  <div id="viewerDoc"></div>
</div>

function joinAnd(a){return a.map((s,i)=>i?"و"+s:s).join(" ");}
function arWords(n){
  const o=["","واحد","اثنان","ثلاثة","أربعة","خمسة","ستة","سبعة","ثمانية","تسعة"];
  const te=["عشرة","أحد عشر","اثنا عشر","ثلاثة عشر","أربعة عشر","خمسة عشر","ستة عشر","سبعة عشر","ثمانية عشر","تسعة عشر"];
  const ti=["","","عشرون","ثلاثون","أربعون","خمسون","ستون","سبعون","ثمانون","تسعون"];
  const hu=["","مائة","مائتان","ثلاثمائة","أربعمائة","خمسمائة","ستمائة","سبعمائة","ثمانمائة","تسعمائة"];
  const h=x=>{const p=[];const hh=Math.floor(x/100),r=x%100;
    if(hh)p.push(hu[hh]);
    if(r>=10&&r<20)p.push(te[r-10]);
    else if(r>=20){const u=r%10;p.push((u?o[u]+" و":"")+ti[Math.floor(r/10)]);}
    else if(r>0)p.push(o[r]);
    return joinAnd(p);};
  if(n===0)return "صفر";
  const grp=(g,one,two,few,many)=>g===1?one:g===2?two:(g>=3&&g<=10)?h(g)+" "+few:h(g).replace(/^مائتان$/,"مائتا")+" "+many;
  const m=Math.floor(n/1e6),th=Math.floor(n%1e6/1e3),r=n%1e3,p=[];
  if(m)p.push(grp(m,"مليون","مليونان","ملايين","مليون"));
  if(th)p.push(grp(th,"ألف","ألفان","آلاف","ألف"));
  if(r)p.push(h(r));
  return joinAnd(p);
}
function enWords(n){
  const a=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
  const b=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
  const h=x=>{let s="";
    if(x>=100){s=a[Math.floor(x/100)]+" hundred";x%=100;if(x)s+=" and ";}
    if(x>=20){s+=b[Math.floor(x/10)]+(x%10?"-"+a[x%10]:"");}
    else if(x>0){s+=a[x];}
    return s;};
  if(n===0)return "zero";
  const m=Math.floor(n/1e6),th=Math.floor(n%1e6/1e3),r=n%1e3,p=[];
  if(m)p.push(h(m)+" million");
  if(th)p.push(h(th)+" thousand");
  if(r)p.push(h(r));
  return p.join(" ");
}
function amountWords(amount,L){
  const total=Math.round(num(amount)*100),iv=Math.floor(total/100),cents=total%100;
  if(iv>=1e9||total<=0)return "";
  const c=S.settings;
  if(L==="ar")return arWords(iv)+" "+c.curAr+(cents?" و"+arWords(cents)+" "+T.ar.d_cents:"")+" "+T.ar.d_only;
  const w=enWords(iv);
  return w.charAt(0).toUpperCase()+w.slice(1)+" "+c.curEn+(cents?" and "+enWords(cents)+" "+T.en.d_cents:"")+" "+T.en.d_only;
}

const SHA_K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
function sha256(msg){
  const bytes=new TextEncoder().encode(msg),l=bytes.length,nb=((l+9+63)>>6)<<6;
  const buf=new Uint8Array(nb);buf.set(bytes);buf[l]=0x80;
  const dv=new DataView(buf.buffer);
  dv.setUint32(nb-8,Math.floor(l*8/4294967296));dv.setUint32(nb-4,(l*8)>>>0);
  let h0=0x6a09e667,h1=0xbb67ae85,h2=0x3c6ef372,h3=0xa54ff53a,h4=0x510e527f,h5=0x9b05688c,h6=0x1f83d9ab,h7=0x5be0cd19;
  const w=new Uint32Array(64),rr=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let o=0;o<nb;o+=64){
    for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){const s0=rr(w[i-15],7)^rr(w[i-15],18)^(w[i-15]>>>3),s1=rr(w[i-2],17)^rr(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0;}
    let a=h0,b=h1,c=h2,d=h3,e=h4,f=h5,g=h6,h=h7;
    for(let i=0;i<64;i++){
      const S1=rr(e,6)^rr(e,11)^rr(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+SHA_K[i]+w[i])>>>0;
      const S0=rr(a,2)^rr(a,13)^rr(a,22),mj=(a&b)^(a&c)^(b&c),t2=(S0+mj)>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
    }
    h0=(h0+a)>>>0;h1=(h1+b)>>>0;h2=(h2+c)>>>0;h3=(h3+d)>>>0;h4=(h4+e)>>>0;h5=(h5+f)>>>0;h6=(h6+g)>>>0;h7=(h7+h)>>>0;
  }
  return [h0,h1,h2,h3,h4,h5,h6,h7].map(x=>x.toString(16).padStart(8,"0")).join("");
}

/* ---- PDF engine: no external libraries (works fully offline) ---- */
async function docCanvas(src){
  const W=700;
  const clone=src.cloneNode(true);
  clone.style.cssText="max-width:none;width:"+W+"px;margin:0;border:0;box-sizing:border-box;background:#fff";
  clone.style.fontFamily=getComputedStyle(document.body).fontFamily;
  const host=document.createElement("div");
  host.style.cssText="position:fixed;left:-10000px;top:0;width:"+W+"px";
  host.appendChild(clone);document.body.appendChild(host);
  const H=Math.ceil(clone.getBoundingClientRect().height)+2;
  host.remove();
  const css=$$("style").map(x=>x.textContent).join("\n");
  const xml=new XMLSerializer().serializeToString(clone);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}"><foreignObject x="0" y="0" width="${W}" height="${H}"><style><![CDATA[${css}]]></style>${xml}</foreignObject></svg>`;
  const img=new Image();
  await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error("render failed"));img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);});
  const sc=Math.min(2,16000/H);
  const c=document.createElement("canvas");
  c.width=Math.round(W*sc);c.height=Math.round(H*sc);
  const x=c.getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.scale(sc,sc);x.drawImage(img,0,0);
  return c;
}
function pdfFromJpeg(jpg,pw,ph){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const put=b=>{if(typeof b==="string")b=enc.encode(b);parts.push(b);len+=b.length;};
  const PW=595.28,PH=841.89,ih=ph*PW/pw,n=Math.max(1,Math.ceil(ih/PH-0.01)),f=v=>v.toFixed(2);
  put(new Uint8Array([0x25,0x50,0x44,0x46,0x2d,0x31,0x2e,0x34,0x0a,0x25,0xe2,0xe3,0xcf,0xd3,0x0a]));
  const obj=(id,body)=>{offs[id]=len;put(id+" 0 obj\n");put(body);put("\nendobj\n");};
  const kids=[];for(let k=0;k<n;k++)kids.push((4+2*k)+" 0 R");
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
  obj(2,"<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+n+" >>");
  offs[3]=len;
  put("3 0 obj\n<< /Type /XObject /Subtype /Image /Width "+pw+" /Height "+ph+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jpg.length+" >>\nstream\n");
  put(jpg);put("\nendstream\nendobj\n");
  for(let k=0;k<n;k++){
    const y=PH-ih+k*PH,content="q "+f(PW)+" 0 0 "+f(ih)+" 0 "+f(y)+" cm /Im0 Do Q";
    obj(4+2*k,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+f(PW)+" "+f(PH)+"] /Resources << /XObject << /Im0 3 0 R >> >> /Contents "+(5+2*k)+" 0 R >>");
    obj(5+2*k,"<< /Length "+content.length+" >>\nstream\n"+content+"\nendstream");
  }
  const total=4+2*n,xo=len;
  let x="xref\n0 "+total+"\n0000000000 65535 f \n";
  for(let i=1;i<total;i++)x+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
  put(x+"trailer\n<< /Size "+total+" /Root 1 0 R >>\nstartxref\n"+xo+"\n%%EOF\n");
  return new Blob(parts,{type:"application/pdf"});
}
async function buildPdfFile(){
  const c=await docCanvas($("#viewerDoc .doc"));
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.92));
  if(!blob)throw new Error("image failed");
  const jpg=new Uint8Array(await blob.arrayBuffer());
  return new File([pdfFromJpeg(jpg,c.width,c.height)],VIEW.name,{type:"application/pdf"});
}
const isNative=()=>!!(window.Capacitor&&typeof Capacitor.isNativePlatform==="function"&&Capacitor.isNativePlatform());
function blobB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=()=>rej(new Error("read failed"));r.readAsDataURL(blob);});}
async function nativeWrite(blob,name,dir){
  const P=Capacitor.Plugins||{};
  if(!P.Filesystem)throw new Error("Filesystem plugin missing");
  const r=await P.Filesystem.writeFile({path:name,data:await blobB64(blob),directory:dir,recursive:true});
  return r.uri;
}
async function nativeShare(blob,name){
  const P=Capacitor.Plugins||{};
  if(!P.Share)throw new Error("Share plugin missing");
  const uri=await nativeWrite(blob,name,"CACHE");
  await P.Share.share({title:name,files:[uri]});
}
const isCancel=e=>/cancel/i.test((e&&e.message)||String(e||""));
async function saveBlob(blob,name,preferShare){
  if(isNative()){
    try{
      if(preferShare){await nativeShare(blob,name);return;}
      await nativeWrite(blob,name,"DOCUMENTS");
      await uiAlert(t("savedTo")+" Documents/"+name);return;
    }catch(e){
      if(isCancel(e))return;
      try{await nativeShare(blob,name);return;}catch(e2){if(!isCancel(e2))await uiAlert("Save failed: "+((e2&&e2.message)||e2));return;}
    }
  }
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),15000);
}
ACT.vPdf=async()=>{try{const f=await buildPdfFile();await saveBlob(f,f.name);}catch(e){uiAlert("PDF: "+e.message);}};
ACT.vShare=async()=>{
  try{
    const f=await buildPdfFile();
    if(isNative()){await saveBlob(f,f.name,true);return;}
    if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});
    else await saveBlob(f,f.name);
  }catch(e){if(e.name!=="AbortError"&&!isCancel(e))uiAlert("Share: "+e.message);}
};

    return `<tr><td>${LTR(fd(x.date))}</td><td>${x.type==="inv"?d.d_typeInv:d.d_typeRec} ${LTR(pn(x.no))}</td><td class="n">${x.type==="inv"?money(x.amt):""}</td><td class="n">${x.type==="rec"?money(x.amt):""}</td><td class="n">${money(bal)}</td></tr>`;
  }).join("");
  let h=head(L,d.d_custStmt,null,today());
  h+=`<div class="box"><div class="cap">${d.d_billTo}</div><strong>${esc(c.name)}</strong>${c.phone?`<div>${LTR(c.phone)}</div>`:""}${c.addr?`<div>${esc(c.addr)}</div>`:""}</div>`;
  h+=`<table><thead><tr><th>${d.d_date}</th><th>${d.d_type}</th><th class="n">${d.d_debit} (${cur()})</th><th class="n">${d.d_credit} (${cur()})</th><th class="n">${d.d_running} (${cur()})</th></tr></thead><tbody>${rows}</tbody></table>`;
  h+=`<div class="tot"><div><span>${d.d_totInvoiced}</span><span>${money(inv)} ${cur()}</span></div><div><span>${d.d_totReceived}</span><span>${money(rec)} ${cur()}</span></div><div class="grand"><span>${d.d_balDue}</span><span>${money(inv-rec)} ${cur()}</span></div></div>`;
  h+=`<div class="foot">${d.d_thanks}</div>`;
  return h;
}
const openInvoice=id=>{const inv=S.invoices.find(i=>i.id===id);if(inv)showDoc(L=>invoiceDoc(inv,L),"invoice-"+pn(inv.no)+".pdf",L=>invoiceText(inv,L),custOf(inv.custId,inv.custName).phone);};
const openReceipt=id=>{const r=S.receipts.find(i=>i.id===id);if(r)showDoc(L=>receiptDoc(r,L),"receipt-"+pn(r.no)+".pdf",L=>receiptText(r,L),custOf(r.custId,r.custName).phone);};
const openVoucher=id=>{const p=S.pays.find(i=>i.id===id);if(p){const w=W(p.wid)||{};showDoc(L=>voucherDoc(p,L),"voucher-"+pn(p.no)+".pdf",L=>voucherText(p,L),w.phone);}};
const openAdvance=id=>{const a=S.advances.find(i=>i.id===id);if(a){const w=W(a.wid)||{};showDoc(L=>advanceDoc(a,L),"advance-"+pn(a.no)+".pdf",L=>advanceText(a,L),w.phone);}};
/* ----- Plain-text versions (for WhatsApp / copy) ----- */
const TL=lines=>lines.filter(x=>x!==null&&x!==undefined&&x!==false).join("\n");
const coHead=()=>"*"+S.settings.co.name+"*";
function coFoot(L){const c=S.settings.co,d=T[L];return TL([c.phone?d.d_phone+": "+c.phone:null,c.email||null]);}
function invoiceText(inv,L){
  const d=T[L],tt=invTotals(inv),paid=invPaid(inv.id),c=custOf(inv.custId,inv.custName),cs=S.settings.cur;
  const rows=inv.lines.map((l,i)=>(i+1)+") "+l.desc+" — "+money(num(l.qty))+(l.unit?" "+l.unit:"")+" × "+money(num(l.price))+" = "+money(num(l.qty)*num(l.price))+" "+cs);
  return TL([coHead(),d.d_invoice+" "+d.d_no+" "+pn(inv.no),d.d_date+": "+fd(inv.date),d.d_billTo+": "+c.name,"",...rows,"",
    tt.disc>0?d.d_discount+": -"+money(tt.disc)+" "+cs:null,
    num(inv.vat)>0?d.d_vat+" ("+num(inv.vat)+"%): "+money(tt.vat)+" "+cs:null,
    "*"+d.d_total+": "+money(tt.total)+" "+cs+"*",
    paid>0?d.d_paid+": "+money(paid)+" "+cs:null,
    paid>0?d.d_balance+": "+money(tt.total-paid)+" "+cs:null,
    inv.notes?"":null,inv.notes||null,"",coFoot(L)]);
}
function receiptText(r,L){
  const d=T[L],c=custOf(r.custId,r.custName),inv=r.invId?S.invoices.find(i=>i.id===r.invId):null,cs=S.settings.cur;
  let extra=null;
  if(inv){
    const total=invTotals(inv).total,upTo=S.receipts.filter(x=>x.invId===inv.id&&x.no<=r.no).reduce((s,x)=>s+x.amount,0);
    extra=d.d_invoice+" "+pn(inv.no)+": "+d.d_invTotal+" "+money(total)+" — "+d.d_paidUpTo+" "+money(upTo)+" — "+d.d_remaining+" "+money(total-upTo)+" "+cs;
  }
  const forT=r.forText||(inv?d.d_payOnInv+" "+pn(inv.no):"");
  const how=r.method==="cheque"?d.d_cheque+(r.chequeNo?" "+r.chequeNo:"")+(r.bank?" — "+r.bank:""):d.d_cash;
  return TL([coHead(),d.d_receipt+" "+d.d_no+" "+pn(r.no),d.d_date+": "+fd(r.date),d.d_recvFrom+": "+c.name,"*"+cs+" "+money(r.amount)+"*",
    d.d_sumOf+": "+(r.words||amountWords(r.amount,L)),forT?d.d_for+": "+forT:null,d.d_method+": "+how,extra,"",coFoot(L)]);
}
function voucherText(p,L){
  const d=T[L],w=W(p.wid)||{name:""},cs=S.settings.cur;
  const rows=dayRows(p.wid,p.days).map(r=>fd(r.date)+(r.pl?" — "+r.pl:"")+(r.f===0.5?" ("+d.d_attHalf+")":"")+": "+money(r.pay)+" "+cs);
  return TL([coHead(),d.d_voucher+" "+d.d_no+" "+pn(p.no),d.d_date+": "+fd(p.date),d.d_worker+": "+w.name,"",...rows,"",
    d.d_gross+": "+money(p.gross)+" "+cs,p.advTotal?d.d_advDed+": -"+money(p.advTotal)+" "+cs:null,p.ded?d.d_ded+": -"+money(p.ded)+" "+cs:null,
    "*"+d.d_net+": "+money(p.net)+" "+cs+"*"]);
}
function advanceText(a,L){
  const d=T[L],w=W(a.wid)||{name:""},cs=S.settings.cur;
  return TL([coHead(),d.d_advance+" "+d.d_no+" "+pn(a.no),d.d_date+": "+fd(a.date),d.d_worker+": "+w.name,"*"+cs+" "+money(a.amount)+"*",
    d.d_sumOf+": "+amountWords(a.amount,L),a.note?d.d_notes+": "+a.note:null]);
}
function statementText(wid,L){
  const d=T[L],w=W(wid),cs=S.settings.cur,rows=dayRows(wid,unpaidDates(wid)),due=sumPay(rows),adv=advSum(advPending(wid));
  return TL([coHead(),d.d_statement,d.d_date+": "+fd(today()),d.d_worker+": "+w.name,"",
    ...rows.map(r=>fd(r.date)+(r.pl?" — "+r.pl:"")+(r.f===0.5?" ("+d.d_attHalf+")":"")+": "+money(r.pay)+" "+cs),"",
    adv>0?d.d_due+": "+money(due)+" "+cs:null,adv>0?d.d_advOut+": -"+money(adv)+" "+cs:null,
    "*"+(adv>0?d.d_netAfter:d.d_due)+": "+money(due-adv)+" "+cs+"*"]);
}
function custStmtText(cid,L){
  const d=T[L],c=custOf(cid,""),cs=S.settings.cur,tx=[];
  S.invoices.filter(i=>i.custId===cid).forEach(i=>tx.push({date:i.date,type:"inv",no:i.no,amt:invTotals(i).total,ord:0}));
  S.receipts.filter(r=>r.custId===cid).forEach(r=>tx.push({date:r.date,type:"rec",no:r.no,amt:r.amount,ord:1}));
  tx.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.ord-b.ord)||(a.no-b.no));
  let inv=0,rec=0;
  const rows=tx.map(x=>{if(x.type==="inv")inv+=x.amt;else rec+=x.amt;
    return fd(x.date)+" — "+(x.type==="inv"?d.d_typeInv:d.d_typeRec)+" "+pn(x.no)+": "+(x.type==="inv"?"+":"-")+money(x.amt)+" "+cs;});
  return TL([coHead(),d.d_custStmt,d.d_date+": "+fd(today()),d.d_billTo+": "+c.name,"",...rows,"",
    d.d_totInvoiced+": "+money(inv)+" "+cs,d.d_totReceived+": "+money(rec)+" "+cs,"*"+d.d_balDue+": "+money(inv-rec)+" "+cs+"*","",coFoot(L)]);
}


/* ===================== Days log table (like the screenshot) ===================== */
const LOG={m:today().slice(0,7),wid:"",pl:"",st:""};

}
function logTable(rows,showName){
  if(!rows.length)return `<p class="muted">${t("noLog")}</p>`;
  const tot=sumPay(rows),unp=sumPay(rows.filter(r=>!r.paid)),days=rows.reduce((s,r)=>s+r.f,0);
  return `<div class="tw"><table class="logt"><thead><tr>${showName?`<th>${t("colName")}</th>`:""}<th>${t("place")}</th><th>${t("colDate")}</th><th>${t("colAtt")}</th><th>${t("colWage")}</th></tr></thead><tbody>`+
    rows.map(r=>`<tr data-act="editDay" data-d="${r.date}" data-w="${r.wid}">${showName?`<td><strong>${esc(r.name)}</strong></td>`:""}<td>${esc(r.pl)||"—"}</td><td><small>${wday(r.date)}</small><br>${LTR(r.date)}</td><td>${attUI(r.f)}</td><td class="${r.paid?"wp":"wu"}">${money(r.pay)}${r.paid?" ✓":""}</td></tr>`).join("")+
    `</tbody></table></div>
    <div class="card"><div class="split"><span>${t("logDays")}</span><strong>${money(days)}</strong></div>
    <div class="split"><span>${t("legendUnpaid")}</span><strong class="red">${money(unp)} ${cur()}</strong></div>
    <div class="split"><span>${t("logTotal")}</span><strong>${money(tot)} ${cur()}</strong></div></div>`;
}
function refreshLog(){const el=$("#logBox");if(el)el.innerHTML=logTable(logRows(),true);}
FN.logM=(el,val)=>{LOG.m=val||today().slice(0,7);saveUI();refreshLog();};
FN.logW=(el,val)=>{LOG.wid=val;saveUI();refreshLog();};
FN.logP=(el,val)=>{LOG.pl=val;saveUI();refreshLog();};
FN.logS=(el,val)=>{LOG.st=val;saveUI();refreshLog();};
ACT.logPdf=()=>{
  const rows=logRows();
  if(!rows.length){uiAlert(t("noLog"));return;}

  showDoc(L=>logDoc(rows,m,L),"days-log-"+m+".pdf");

/* ===================== DAILY ===================== */
let dailyDate=today();
function unpaidHTML(){
  let total=0;
  const rows=S.workers.map(w=>{
    const ds=unpaidDates(w.id);
    if(!ds.length)return "";
    const amt=sumPay(dayRows(w.id,ds));
    total+=amt;
    return `<div class="card"><div class="split"><div><strong>${esc(w.name)}</strong><div class="muted">${ds.length} ${t("days")}</div></div><strong class="red">${money(amt)} ${cur()}</strong></div>
      <div class="btns"><button class="sm ok" data-act="payOpen" data-id="${w.id}">${t("payBtn")}</button><button class="sm ghost" data-act="stmt" data-id="${w.id}">${t("stmtBtn")}</button></div></div>`;
  }).join("");
  if(!rows)return `<p class="muted">${t("nothingUnpaid")}</p>`;
  return rows+`<p class="total">${t("totalUnpaid")}: ${money(total)} ${cur()}</p>`;
}
function backupBanner(){
  if(!(S.workers.length||S.invoices.length||S.receipts.length))return "";
  const b=S.last.backup;
  const old=!b||((new Date(today())-new Date(b))/864e5>14);
  return old?`<div class="card warnbox"><div>${t("backupWarn")}</div><div class="btns"><button class="sm" data-act="exportData">${t("backupNow")}</button></div></div>`:"";
}
function renderDaily(){
  const day=S.days[dailyDate]||{};
  const open=S.workers.filter(w=>!(day[w.id]&&day[w.id].paid));
  const hidden=S.workers.length-open.length;
  let h=backupBanner()+`<h2>${t("tabDaily")}</h2>`;
  h+=`<div class="row"><button class="sm ghost" data-act="dPrev">${t("prevDay")}</button><input type="date" value="${dailyDate}" data-fn="dailyDate"><button class="sm ghost" data-act="dNext">${t("nextDay")}</button></div>`;
  h+=`<div class="split muted" style="margin:6px 0"><span>${wday(dailyDate)} — ${fd(dailyDate)}</span><button class="sm ghost" data-act="dToday">${t("todayBtn")}</button></div>`;
  h+=`<div class="card"><label style="margin-top:0">${t("defPlace")}</label><div class="row"><select data-fn="defPl">${placeOptions(S.last.pl)}</select><button class="sm" data-act="quickPlace" data-ctx="def">${t("addPlaceBtn")}</button></div>
    <div class="btns"><button class="sm ghost" data-act="applyPl">${t("applyAll")}</button><button class="sm ghost" data-act="markAll">${t("markAll")}</button></div></div>`;
  if(!S.workers.length)h+=`<p class="muted">${t("noWorkers")}</p>`;
  h+=open.map(w=>{
    const r=day[w.id]||{},att=r.w?fOf(r):0;
    const seg=[[0,"attAbsent"],[1,"attFull"],[0.5,"attHalf"]].map(a=>`<button class="${att===a[0]?"on":""} ${a[0]===0?"abs":""}" data-act="att" data-w="${w.id}" data-v="${a[0]}">${t(a[1])}</button>`).join("");
    return `<div class="card prow" data-w="${w.id}">
      <div class="who"><strong>${esc(w.name)}</strong></div>
      <strong class="pp">${money(r.w?payOfRec(w,r):0)} ${cur()}</strong>
      <div class="seg3">${seg}</div>
      ${r.w?`<div class="row site"><select data-fn="dayPl">${placeOptions(r.pl)}</select><button class="sm" data-act="quickPlace" data-ctx="row" data-w="${w.id}">${t("addPlaceBtn")}</button></div>
      <input type="number" inputmode="decimal" placeholder="${t("extra")}" value="${r.x||""}" data-fn="dayF" data-f="x">
      <input type="number" inputmode="decimal" placeholder="${t("ded")}" value="${r.d||""}" data-fn="dayF" data-f="d">`:""}
    </div>`;
  }).join("");
  if(hidden)h+=`<p class="muted">${t("hiddenPaid").replace("{n}",hidden)}</p>`;
  h+=`<h2>${t("unpaidTitle")}</h2><div id="unpaidBox">${unpaidHTML()}</div>`;
  h+=`<h2>${t("logTitle")}</h2>
    <div class="row2"><div><label>${t("month")}</label><input type="month" value="${LOG.m}" data-fn="logM"></div>
    <div><label>${t("worker")}</label><select data-fn="logW"><option value="">${t("allWorkers")}</option>${S.workers.map(w=>`<option value="${w.id}" ${LOG.wid===w.id?"selected":""}>${esc(w.name)}</option>`).join("")}</select></div></div>
    <div class="row2"><div><label>${t("place")}</label><select data-fn="logP">${placeOptions(LOG.pl,"allPlaces")}</select></div>
    <div><label>${t("status")}</label><select data-fn="logS"><option value="">${t("allStatus")}</option><option value="unpaid" ${LOG.st==="unpaid"?"selected":""}>${t("legendUnpaid")}</option><option value="paid" ${LOG.st==="paid"?"selected":""}>${t("legendPaid")}</option></select></div></div>
    <div id="logBox" style="margin-top:8px">${logTable(logRows(),true)}</div>
    <div class="btns"><button class="sm" data-act="logPdf">${t("logPdf")}</button></div>`;
  $("#dailyView").innerHTML=h;
}
FN.dailyDate=(el,val)=>{dailyDate=val||today();saveUI();renderDaily();};
const shiftDay=n=>{const d=new Date(dailyDate+"T00:00:00");d.setDate(d.getDate()+n);dailyDate=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());saveUI();renderDaily();};
ACT.dPrev=()=>shiftDay(-1);
ACT.dNext=()=>shiftDay(1);
ACT.dToday=()=>{dailyDate=today();saveUI();renderDaily();};
FN.defPl=(el,val)=>{S.last.pl=val;save();};
ACT.att=el=>{
  const wid=el.dataset.w,v=+el.dataset.v,w=W(wid);
  if(v===0){
    const day=S.days[dailyDate];
    if(day&&day[wid]&&!day[wid].paid){delete day[wid];if(!Object.keys(day).length)delete S.days[dailyDate];}
  }else{
    const r=ensureRec(dailyDate,wid);
    if(!r.w){r.w=true;r.r=w.rate;r.pl=r.pl||S.last.pl||"";}
    r.f=v;
  }
  save();renderAll();
};
ACT.markAll=()=>{
  S.workers.forEach(w=>{
    const r0=(S.days[dailyDate]||{})[w.id];
    if(r0&&(r0.paid||r0.w))return;
    const r=ensureRec(dailyDate,w.id);
    r.w=true;r.f=1;r.r=w.rate;r.pl=r.pl||S.last.pl||"";
  });
  save();renderAll();
};
ACT.applyPl=()=>{
  const day=S.days[dailyDate]||{};
  S.workers.forEach(w=>{const r=day[w.id];if(r&&r.w&&!r.paid)r.pl=S.last.pl||"";});
  save();renderAll();
};
FN.dayPl=(el,val)=>{
  const wid=el.closest("[data-w]").dataset.w,r=ensureRec(dailyDate,wid);
  r.pl=val;if(val)S.last.pl=val;
  save();renderAll();
};
FN.dayF=el=>{
  const card=el.closest("[data-w]"),wid=card.dataset.w,w=W(wid),r=ensureRec(dailyDate,wid),f=el.dataset.f;
  r[f]=el.value===""?"":num(el.value);
  save();
  card.querySelector(".pp").textContent=money(r.w?payOfRec(w,r):0)+" "+S.settings.cur;
  $("#unpaidBox").innerHTML=unpaidHTML();
  refreshLog();
};
ACT.quickPlace=async el=>{
  const n=await uiPrompt(t("askPlace"));
  if(!n||!n.trim())return;
  const p=addPlaceByName(n.trim()),ctx=el.dataset.ctx;
  if(ctx==="def"){S.last.pl=p.id;}
  else if(ctx==="row"){ensureRec(dailyDate,el.dataset.w).pl=p.id;S.last.pl=p.id;}
  else if(ctx==="edit"&&ED&&S.days[ED.date]&&S.days[ED.date][ED.wid]){S.days[ED.date][ED.wid].pl=p.id;}
  save();
  if(ctx==="edit")drawEdit();else renderAll();
};
ACT.stmt=el=>{
  const wid=el.dataset.id,w=W(wid);
  if(!unpaidDates(wid).length){uiAlert(t("nothingUnpaid"));return;}
  showDoc(L=>statementDoc(wid,L),"statement-"+w.name.replace(/\s+/g,"_")+".pdf",L=>statementText(wid,L),w.phone);
};

/* ----- Edit one day (sheet) ----- */
let ED=null;
const closeModal=()=>{$("#modal").hidden=true;PAY=null;ED=null;PICK=null;};
ACT.payClose=()=>{closeModal();};

  h+=`<label>${t("place")}</label><div class="row"><select data-fn="edPl">${placeOptions(r.pl)}</select><button class="sm" data-act="quickPlace" data-ctx="edit">${t("addPlaceBtn")}</button></div>`;

ACT.editDay=el=>{

ACT.edAtt=el=>{edRec().f=+el.dataset.v;save();drawEdit();};
FN.edPl=(el,val)=>{edRec().pl=val;save();};
FN.edF=el=>{

ACT.edDone=()=>{closeModal();renderAll();};
ACT.edDel=async()=>{
  if(!(await uiConfirm(t("confirmDel"),true)))return;

  if(!Object.keys(S.days[ED.date]).length)delete S.days[ED.date];

$("#modal").addEventListener("click",e=>{if(e.target&&e.target.id==="modal"){closeModal();renderAll();}});

/* ----- Pay worker (sheet) ----- */
let PAY=null;
ACT.payOpen=el=>{
  const wid=el.dataset.id;
  PAY={wid:wid,sel:new Set(unpaidDates(wid)),advSel:new Set(advPending(wid).map(a=>a.id)),ded:"",note:"",date:today()};
  drawPay();
  $("#modal").hidden=false;
};
function payAdvNow(){return advSum(advPending(PAY.wid).filter(a=>PAY.advSel.has(a.id)));}
function payNetNow(){return sumPay(dayRows(PAY.wid,[...PAY.sel]))-payAdvNow()-num(PAY.ded);}
function updPayNet(){const el=$("#payNet");if(el)el.textContent=money(payNetNow())+" "+S.settings.cur;}
function drawPay(){
  const w=W(PAY.wid),rows=dayRows(PAY.wid,unpaidDates(PAY.wid)),adv=advPending(PAY.wid);
  let h=`<h2>${t("payTitle")}: ${esc(w.name)}</h2><label>${t("pickDays")}</label><div class="card">`;
  h+=rows.map(r=>`<label class="pick"><input type="checkbox" data-fn="paySel" data-d="${r.date}" ${PAY.sel.has(r.date)?"checked":""}><span>${wday(r.date)} ${fd(r.date)}${r.pl?" — "+esc(r.pl):""}${r.f===0.5?" — "+t("attHalf"):""}</span><strong>${money(r.pay)}</strong></label>`).join("");
  h+=`</div><button class="sm ghost" data-act="paySelAll">${t("selAll")}</button>`;
  if(adv.length){

  const lines=v.lines.filter(l=>l.desc.trim()||num(l.price)).map(l=>({pid:l.pid,desc:l.desc.trim(),qty:l.qty===""?1:num(l.qty),price:num(l.price),unit:(l.unit||"").trim()}));
  if(!lines.length){uiAlert(t("needLines"));return;}
  const c=S.customers.find(x=>x.id===v.custId);
  let inv;
  if(v.id)inv=S.invoices.find(i=>i.id===v.id);
  if(!inv){inv={id:uid(),no:S.no.inv++};S.invoices.push(inv);}
  Object.assign(inv,{date:v.date||today(),custId:v.custId,custName:c?c.name:"",lines:lines,disc:num(v.disc),vat:num(v.vat),notes:v.notes});
  save();D.inv=newInv();renderAll();openInvoice(inv.id);
};

/* ----- Pick several saved products at once ----- */
let PICK=null;
ACT.pickProducts=()=>{PICK={sel:{},q:""};drawPick();$("#modal").hidden=false;};
function pickRows(){
  if(!S.products.length)return `<p class="muted">${t("pickEmpty")}</p>`;
  const q=PICK.q.trim().toLowerCase();
  const list=S.products.filter(p=>!q||p.name.toLowerCase().includes(q));
  if(!list.length)return `<p class="muted">${t("pickNoMatch")}</p>`;
  return list.map(p=>{
    const on=PICK.sel[p.id]!=null;
    return `<div class="pick2" data-pid="${p.id}"><label class="pk"><input type="checkbox" data-fn="pickTog" ${on?"checked":""}><span><strong>${esc(p.name)}</strong><small>${money(p.price)} ${cur()}${p.unit?" / "+esc(p.unit):""}</small></span></label><input class="pq" type="number" inputmode="decimal" value="${on?esc(PICK.sel[p.id]):"1"}" data-fn="pickQty" ${on?"":"disabled"}></div>`;
  }).join("");

function updPickCount(){
  const n=Object.keys(PICK.sel).length;
  const el=$("#pickCount");if(el)el.textContent=t("pickCount").replace("{n}",n);
  const b=$("#pickAddBtn");if(b)b.disabled=!n;
}
function drawPick(){
  let h=`<h2>${t("pickTitle")}</h2><input type="search" placeholder="${t("pickSearch")}" value="${esc(PICK.q)}" data-fn="pickSearch"><div id="pickList">${pickRows()}</div>`;
  h+=`<div class="pickbar"><div class="split"><span id="pickCount" class="total"></span><span class="row" style="gap:6px"><button class="sm ghost" data-act="pickAll">${t("selAll")}</button><button class="sm ghost" data-act="pickClear">${t("pickNone")}</button></span></div>
    <div class="btns"><button id="pickAddBtn" data-act="pickConfirm">${t("pickAdd")}</button><button class="ghost" data-act="pickCancel">${t("cancel")}</button></div></div>`;
  $("#sheet").innerHTML=h;updPickCount();
}
FN.pickSearch=(el,val)=>{PICK.q=val;$("#pickList").innerHTML=pickRows();};
FN.pickTog=el=>{
  const row=el.closest("[data-pid]"),q=row.querySelector(".pq");
  if(el.checked){PICK.sel[row.dataset.pid]=q.value||"1";q.disabled=false;}
  else{delete PICK.sel[row.dataset.pid];q.disabled=true;}
  updPickCount();
};
FN.pickQty=el=>{const pid=el.closest("[data-pid]").dataset.pid;if(PICK.sel[pid]!=null)PICK.sel[pid]=el.value;};
ACT.pickAll=()=>{
  const q=PICK.q.trim().toLowerCase();
  S.products.filter(p=>!q||p.name.toLowerCase().includes(q)).forEach(p=>{if(PICK.sel[p.id]==null)PICK.sel[p.id]="1";});

};
ACT.pickClear=()=>{PICK.sel={};$("#pickList").innerHTML=pickRows();updPickCount();};
ACT.pickCancel=()=>{closeModal();};
ACT.pickConfirm=()=>{
  const chosen=S.products.filter(p=>PICK.sel[p.id]!=null);
  if(!chosen.length)return;
  D.inv.lines=D.inv.lines.filter(l=>l.desc.trim()||num(l.price)||l.pid);

  h+=`<label>${t("amount")} (${cur()})</label><input type="number" inputmode="decimal" value="${esc(v.amount)}" data-b="rec.amount" data-fn="recAmt">`;

  h+=`<label>${t("forText")}</label><input value="${esc(v.forText)}" data-b="rec.forText">`;
  h+=`<label>${t("method")}</label><div><label class="inl"><input type="radio" name="meth" value="cash" data-b="rec.method" data-fn="recMethod" ${v.method==="cash"?"checked":""}> ${t("cash")}</label><label class="inl"><input type="radio" name="meth" value="cheque" data-b="rec.method" data-fn="recMethod" ${v.method==="cheque"?"checked":""}> ${t("cheque")}</label></div>`;
  if(v.method==="cheque"){
    h+=`<div class="row2"><div><label>${t("chequeNo")}</label><input value="${esc(v.chequeNo)}" data-b="rec.chequeNo"></div><div><label>${t("drawnOn")}</label><input value="${esc(v.bank)}" data-b="rec.bank"></div></div>
      <label>${t("chequeDate")}</label><input type="date" value="${v.chequeDate}" data-b="rec.chequeDate">`;
  }
  h+=`<div class="btns"><button data-act="saveRec">${t("saveRec")}</button></div>`;
  h+=`<h2>${t("savedReceipts")}</h2>`;

ACT.saveRec=async()=>{
  const v=D.rec,amt=num(v.amount);

  if(amt<=0){uiAlert(t("needAmount"));return;}
  const inv=v.invId?S.invoices.find(i=>i.id===v.invId):null;
  if(inv&&amt>invBalance(inv)+0.005&&!(await uiConfirm(t("overBalance"),true)))return;
  const c=S.customers.find(x=>x.id===v.custId);
  const r={id:uid(),no:S.no.rec++,date:v.date||today(),custId:v.custId,custName:c?c.name:"",invId:v.invId||"",amount:amt,
    words:v.words.trim(),forText:v.forText.trim(),method:v.method,chequeNo:v.chequeNo,bank:v.bank,chequeDate:v.chequeDate};
  S.receipts.push(r);save();D.rec=newRec();renderAll();openReceipt(r.id);
};

/* ===================== SUMMARY (report) ===================== */
const REP={m:today().slice(0,7)};
function renderReport(){
  const m=REP.m,cs=" "+S.settings.cur;
  const rows=allRows(r=>r.date.startsWith(m));
  const earned=sumPay(rows);
  const paidPays=S.pays.filter(p=>p.date.startsWith(m)).reduce((s,p)=>s+p.net,0);
  const advGiven=S.advances.filter(a=>a.date.startsWith(m)).reduce((s,a)=>s+a.amount,0);
  const paidOut=paidPays+advGiven;
  const unpaidAll=S.workers.reduce((s,w)=>s+sumPay(dayRows(w.id,unpaidDates(w.id))),0);
  const advOut=advSum(S.advances.filter(a=>!a.payId));
  const invoiced=S.invoices.filter(i=>i.date.startsWith(m)).reduce((s,i)=>s+invTotals(i).total,0);
  const collected=S.receipts.filter(r=>r.date.startsWith(m)).reduce((s,r)=>s+r.amount,0);
  const receivable=S.customers.reduce((s,c)=>s+Math.max(0,custBalance(c.id)),0);
  const row=(k,v,cls)=>`<div class="split"><span>${k}</span><strong${cls?` class="${cls}"`:""}>${v}</strong></div>`;
  let h=`<h2>${t("tabReport")}</h2><label>${t("month")}</label><input type="month" value="${m}" data-fn="repM">`;
  h+=`<h3>${t("repWorkers")}</h3><div class="card">`+row(t("repEarned"),money(earned)+cs)+row(t("repPaidOut"),money(paidOut)+cs)+row(t("repUnpaidAll"),money(unpaidAll)+cs,"red")+row(t("repAdvOut"),money(advOut)+cs)+`</div>`;
  h+=`<h3>${t("repCust")}</h3><div class="card">`+row(t("repInvoiced"),money(invoiced)+cs)+row(t("repCollected"),money(collected)+cs,"green")+row(t("repReceivable"),money(receivable)+cs,"red")+`</div>`;
  h+=`<div class="card">`+row(t("repDiff"),money(collected-paidOut)+cs,collected-paidOut>=0?"green":"red")+`<div class="muted">${t("repNote")}</div></div>`;
  const byP={};
  rows.forEach(r=>{const k=r.plId||"-";(byP[k]=byP[k]||{name:r.pl||t("noPlaceLabel"),days:0,pay:0});byP[k].days+=r.f;byP[k].pay+=r.pay;});
  const pl=Object.values(byP).sort((a,b)=>b.pay-a.pay);
  h+=`<h3>${t("repByPlace")}</h3>`;
  h+=pl.length?`<div class="tw"><table class="logt"><thead><tr><th>${t("place")}</th><th>${t("logDays")}</th><th>${t("colWage")}</th></tr></thead><tbody>`+pl.map(x=>`<tr><td><strong>${esc(x.name)}</strong></td><td>${money(x.days)}</td><td>${money(x.pay)}</td></tr>`).join("")+`</tbody></table></div>`:`<p class="muted">${t("noLog")}</p>`;
  const byW={};
  rows.forEach(r=>{(byW[r.wid]=byW[r.wid]||{name:r.name,days:0,pay:0,unp:0});byW[r.wid].days+=r.f;byW[r.wid].pay+=r.pay;if(!r.paid)byW[r.wid].unp+=r.pay;});
  const wk=Object.values(byW).sort((a,b)=>b.pay-a.pay);
  h+=`<h3>${t("repByWorker")}</h3>`;
  h+=wk.length?`<div class="tw"><table class="logt"><thead><tr><th>${t("colName")}</th><th>${t("logDays")}</th><th>${t("colWage")}</th><th>${t("legendUnpaid")}</th></tr></thead><tbody>`+wk.map(x=>`<tr><td><strong>${esc(x.name)}</strong></td><td>${money(x.days)}</td><td>${money(x.pay)}</td><td class="${x.unp?"wu":""}">${money(x.unp)}</td></tr>`).join("")+`</tbody></table></div>`:`<p class="muted">${t("noLog")}</p>`;
  $("#reportView").innerHTML=h;
}

  h+=`<h3>${t("backup")}</h3><p class="muted">${t("backupHint")}</p>
    <p class="muted">${t("backupLast")}: ${S.last.backup?fd(S.last.backup):t("backupNever")}</p>
    <div class="btns"><button data-act="exportData">${t("exportData")}</button></div>
    <label>${t("importData")}</label><input type="file" accept="application/json,.json" data-fn="importFile">`;
  $("#settingsView").innerHTML=h;
  $("#hLogo").src=s.logo||LOGO;
}
FN.uiChange=()=>{applyLang();renderAll();};
FN.logoFile=el=>{
  const f=el.files&&el.files[0];if(!f)return;
  const img=new Image();
  img.onload=()=>{
    const k=Math.min(1,500/Math.max(img.width,img.height));
    const c=document.createElement("canvas");
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    S.settings.logo=c.toDataURL("image/png");save();renderSettings();
  };
  img.src=URL.createObjectURL(f);
};
ACT.resetLogo=()=>{S.settings.logo="";save();renderSettings();};
ACT.exportData=async()=>{
  S.last.backup=today();save();
  await saveBlob(new Blob([JSON.stringify(S)],{type:"application/json"}),"essp-backup-"+today()+".json",true);
  renderAll();
};
FN.importFile=el=>{
  const f=el.files&&el.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=async()=>{
    try{
      const j=JSON.parse(rd.result);
      if(!j||!Array.isArray(j.workers)||!Array.isArray(j.invoices))throw new Error("bad");
      if(!(await uiConfirm(t("importConfirm"),true)))return;
      S=mergeState(DEF(),j);migrate();save();applyLang();renderAll();uiAlert(t("importOk"));
    }catch(e){uiAlert(t("importFail"));}
  };
  rd.readAsText(f);
};


/* ===================== Install helper (Chrome "Install app") ===================== */
let DEFERRED=null;
const isStandalone=()=>(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault();DEFERRED=e;
  const a=document.activeElement;
  if(!LOCKED&&!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)))renderSettings();
});
window.addEventListener("appinstalled",()=>{DEFERRED=null;if(!LOCKED)renderSettings();});
function installHTML(){
  if(isNative())return "";
  let h=`<h3>${t("installTitle")}</h3>`;
  if(isStandalone())return h+`<p class="muted">${t("installDone")}</p>`;
  h+=`<p class="muted">${t("installHint")}</p><div class="btns">`;
  if(DEFERRED)h+=`<button data-act="installNow">${t("installNow")}</button>`;
  return h+`<button class="sm ghost" data-act="installCheck">${t("installCheck")}</button></div>`;
}
ACT.installNow=async()=>{
  if(!DEFERRED)return;
  DEFERRED.prompt();
  try{await DEFERRED.userChoice;}catch(e){}
  DEFERRED=null;renderSettings();
};
async function installReport(){
  const out=[],ok=(c,m)=>out.push((c?"✓ ":"✗ ")+m);
  ok(location.protocol==="https:"||location.hostname==="localhost",t("rptHttps"));
  ok(navigator.onLine,t("rptOnline"));
  let man=null,mUrl="";
  try{
    const link=document.querySelector('link[rel="manifest"]');mUrl=link.href;
    const r=await fetch(mUrl,{cache:"no-store"});ok(r.ok,t("rptManifest")+" ("+r.status+")");
    if(r.ok)man=await r.json();
  }catch(e){ok(false,t("rptManifest"));}
  for(const n of [192,512]){
    let good=false;
    try{
      const ic=man&&(man.icons||[]).find(i=>String(i.sizes).indexOf(n+"x"+n)===0&&(i.purpose||"any").indexOf("any")>=0);
      if(ic){const r=await fetch(new URL(ic.src,mUrl).href,{cache:"no-store"});good=r.ok;}
    }catch(e){}
    ok(good,t("rptIcon").replace("{n}",n));
  }
  let reg=null;
  try{reg=await navigator.serviceWorker.getRegistration();}catch(e){}
  ok(!!(reg&&reg.active),t("rptSw"));
  ok(!!(navigator.serviceWorker&&navigator.serviceWorker.controller),t("rptCtrl"));
  ok(!!DEFERRED,t("rptPrompt"));
  out.push("",t("rptTipFiles"),t("rptTipNet"),t("rptTipReload"));
  return out.join("\n");
}
ACT.installCheck=async()=>{await uiAlert(await installReport());};

/* ===================== Start ===================== */
function applyLang(){
  const ar=S.settings.ui==="ar";
  document.documentElement.lang=ar?"ar":"en";
  document.documentElement.dir=ar?"rtl":"ltr";
  $$("[data-i]").forEach(el=>{el.textContent=t(el.dataset.i);});
  document.title=t("app");
}
function renderAll(){renderDaily();renderWorkers();renderInvoices();renderReceipts();renderDir();renderReport();renderSettings();}
$("#dlg").addEventListener("click",e=>{if(e.target&&e.target.id==="dlg"){if(DLG&&DLG.o.mode==="alert")ACT.dlgOk();else ACT.dlgNo();}});
$("#hLogo").src=S.settings.logo||LOGO;
function loadUI(){
  try{
    const u=JSON.parse(localStorage.getItem(UIKEY));if(!u)return;
    if(/^\d{4}-\d{2}-\d{2}$/.test(u.dd))dailyDate=u.dd;
    if(u.wid&&W(u.wid))WV.id=u.wid;
    if(Number.isInteger(u.y)&&Number.isInteger(u.m)&&u.m>=0&&u.m<=11){WV.y=u.y;WV.m=u.m;}
    if(u.log&&typeof u.log==="object"){
      if(/^\d{4}-\d{2}$/.test(u.log.m))LOG.m=u.log.m;
      LOG.wid=(u.log.wid&&W(u.log.wid))?u.log.wid:"";
      LOG.pl=(u.log.pl&&PL(u.log.pl))?u.log.pl:"";
      LOG.st=["","paid","unpaid"].includes(u.log.st)?u.log.st:"";
    }
    if(/^\d{4}-\d{2}$/.test(u.rep))REP.m=u.rep;
    if(["daily","workers","invoices","receipts","dir","report","settings"].includes(u.tab))curTab=u.tab;
  }catch(e){}
}
/* Stop "pull down at the very top = refresh the page" (it used to send you back to the Daily tab) */
(function(){
  let y0=0,x0=0,atTop=false;
  document.addEventListener("touchstart",e=>{
    if(!e.touches.length)return;
    y0=e.touches[0].clientY;x0=e.touches[0].clientX;
    atTop=(window.pageYOffset||document.documentElement.scrollTop||0)<=0;
  },{passive:true});
  document.addEventListener("touchmove",e=>{
    if(!atTop||!e.touches.length)return;
    const dy=e.touches[0].clientY-y0,dx=e.touches[0].clientX-x0;
    if(dy<=0||Math.abs(dx)>Math.abs(dy))return;
    let el=e.target;
    while(el&&el!==document.body&&el!==document.documentElement){
      if(el.scrollTop>0&&el.scrollHeight>el.clientHeight+1)return;
      el=el.parentElement;
    }
    if(e.cancelable)e.preventDefault();
  },{passive:false});
})();
applyLang();
loadUI();
if(lockCfg())showLock();else{renderAll();gotoTab(curTab);}
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol)&&!isNative())navigator.serviceWorker.register("sw.js").catch(()=>{});
function nativeExit(){const A=(window.Capacitor&&Capacitor.Plugins)?Capacitor.Plugins.App:null;if(A&&A.exitApp)A.exitApp();}
function nativeBack(){
  if(DLG){ACT.dlgNo();return;}
  if(LOCKED){nativeExit();return;}
  if(VIEW){ACT.vClose();return;}
  if(!$("#modal").hidden){closeModal();renderAll();return;}
  if(WV.id&&$("#tab-workers").classList.contains("active")){WV.id=null;renderWorkers();return;}
  if(!$("#tab-daily").classList.contains("active")){gotoTab("daily");return;}
  nativeExit();
}
if(isNative()&&Capacitor.Plugins&&Capacitor.Plugins.App&&Capacitor.Plugins.App.addListener)Capacitor.Plugins.App.addListener("backButton",nativeBack);
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
